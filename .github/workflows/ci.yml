name: CI

# PR ve main push'unda tüm doğrulama ağını çalıştırır:
# i18n parity + rustfmt + clippy (-D warnings) + prettier + güvenlik invariant
# testleri + cargo lib testleri + vitest + frontend build.
# Bu sayede kırık bir invariant, bozuk i18n veya lint uyarısı main'e merge edilemez.
on:
  pull_request:
  push:
    branches:
      - main

# Aynı ref için eski koşuları iptal et (PR'a yeni push gelince).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust (stable + msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install npm deps
        run: npm ci --no-audit --no-fund

      # check:all = i18n + fmt + clippy + prettier + security_invariants + cargo lib
      #             + vitest + frontend build
      - name: Run composite check
        run: npm run check:all

  # Bağımlılık güvenlik denetimi — RustSec advisory DB'ye karşı Cargo.lock.
  # Ayrı job (ubuntu, hızlı); ana check'i bloklamaz ama PR'da görünür.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # RUSTSEC-2026-0194/0195 (quick-xml <0.41, DoS parsing untrusted XML) ignore edilir:
      # transitive via tauri-utils -> plist (macOS Info.plist parsing) -> quick-xml ^0.39,
      # `plist` crate'inin kendisi pinliyor, elimizde değil. PC Doctor yalnız Windows'a
      # derleniyor; bu kod yolu çalışan uygulamada hiç tetiklenmiyor (güvenilmeyen XML girdisi
      # yok). Her `cargo update`/Tauri sürüm atlamasında tekrar kontrol et; `plist` (veya
      # Tauri) quick-xml >=0.41'e geçince kaldır.
      - name: Run cargo audit
        working-directory: src-tauri
        run: cargo audit --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195
